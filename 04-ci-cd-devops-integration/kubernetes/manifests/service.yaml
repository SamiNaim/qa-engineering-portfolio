# Declarative equivalent of module 4:
#   kubectl expose deployment/kubernetes-bootcamp --type=NodePort --port=8080
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-bootcamp
  labels:
    app: kubernetes-bootcamp
spec:
  type: NodePort   # reachable from outside the cluster on <node-ip>:<nodePort>
  selector:
    app: kubernetes-bootcamp   # the label, not the deployment name, is what binds them
  ports:
    - port: 8080         # port on the Service
      targetPort: 8080   # port on the pod
      nodePort: 30080    # fixed so the URL does not change between runs (30000-32767)
