name: Test with Actions

# Course: https://learn.github.com/courses/testwithActions
# Runs the Playwright API tests from 01-api-testing/playwright-tests on every
# push and pull request, so a broken test blocks the merge instead of the merge
# blocking the discovery of a broken test.

on:
  push:
    branches: [main]
    paths:
      - '01-api-testing/playwright-tests/**'
      - '.github/workflows/test-with-actions.yml'
  pull_request:
    paths:
      - '01-api-testing/playwright-tests/**'
      - '.github/workflows/test-with-actions.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: 01-api-testing/playwright-tests

jobs:
  api-tests:
    name: Playwright API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01-api-testing/playwright-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test tests/api_tests.spec.ts --project=chromium

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 01-api-testing/playwright-tests/playwright-report/
          retention-days: 7
