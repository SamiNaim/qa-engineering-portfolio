name: Web UI Automation

on:
  push:
    branches: [main]
    paths:
      - '02-web-ui-automation/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - '02-web-ui-automation/**'
      - '.github/workflows/playwright.yml'
  # Nightly run against the live demo sites, to catch third-party drift.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: 02-web-ui-automation

jobs:
  static-analysis:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 02-web-ui-automation/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 02-web-ui-automation/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: 02-web-ui-automation/blob-report
          retention-days: 7

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: 02-web-ui-automation/test-results/junit.xml
          retention-days: 7

  report:
    name: Merge report
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 02-web-ui-automation/package-lock.json

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: 02-web-ui-automation/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 02-web-ui-automation/playwright-report
          retention-days: 14

      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          path: 02-web-ui-automation/junit
          pattern: junit-*
          merge-multiple: false

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: Playwright results
          path: 02-web-ui-automation/junit/**/junit.xml
          reporter: java-junit
          fail-on-error: false
