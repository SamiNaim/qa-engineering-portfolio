name: Hello GitHub Actions

# Course: https://learn.github.com/courses/helloGitHubActions
# The "hello world" of workflows: an event triggers a job, the job runs steps
# on a GitHub-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  say-hello:
    name: Say hello
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        run: echo "Hello, GitHub Actions!"

      - name: Print event context
        run: |
          echo "Triggered by : ${{ github.event_name }}"
          echo "Repository   : ${{ github.repository }}"
          echo "Ref          : ${{ github.ref }}"
          echo "Actor        : ${{ github.actor }}"
          echo "Runner OS    : ${{ runner.os }}"

  welcome-comment:
    name: Post welcome comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the pull request
        run: gh pr comment "$PR_URL" --body "Welcome, and thanks for opening this pull request! 🎉"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
